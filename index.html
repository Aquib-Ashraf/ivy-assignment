<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ivy Homes Property Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">
  <!-- Top Navigation Header -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-500 text-white font-black rounded-lg px-3 py-1 text-lg">IVY</div>
        <h1 class="text-xl font-bold tracking-tight">Property Analytics Portal</h1>
      </div>
      <nav class="flex space-x-2 text-sm font-semibold">
        <button onclick="showTab('listings')" class="px-3 py-2 rounded-md hover:bg-slate-800 transition">Listings</button>
        <button onclick="showTab('rentals')" class="px-3 py-2 rounded-md hover:bg-slate-800 transition">Rentals</button>
        <button onclick="showTab('projects')" class="px-3 py-2 rounded-md hover:bg-slate-800 transition">Projects</button>
        <button onclick="showTab('saved')" class="px-3 py-2 rounded-md hover:bg-slate-800 transition">Saved (/v1/saved)</button>
        <button onclick="showTab('insights')" class="px-3 py-2 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white transition">Insights & Audits</button>
      </nav>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full">
    <div id="app-view"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
    Ivy Homes SWE Internship Assignment · Candidate: Aquib Ashraf
  </footer>

  <script>
    function showTab(tab) {
      const view = document.getElementById('app-view');
      if (tab === 'listings') {
        view.innerHTML = `
          <div class="mb-6 flex justify-between items-center">
            <div>
              <h2 class="text-3xl font-bold text-gray-900">Sale Listings</h2>
              <p class="text-gray-500 text-sm">Browsing retrievable properties across the city (4,400 Total Records, 3,477 Active)</p>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
              <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded">LIVE</span>
              <h3 class="text-xl font-bold mt-2">Prestige Lakeside Habitat</h3>
              <p class="text-gray-500 text-sm mb-4">Whitefield · 3 BHK Apartment</p>
              <div class="text-2xl font-black text-indigo-600">₹1,45,00,000</div>
              <p class="text-xs text-gray-400 mt-1">1,240 sq.ft Carpet Area · 7th Floor</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
              <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded">LIVE</span>
              <h3 class="text-xl font-bold mt-2">Brigade Millennium</h3>
              <p class="text-gray-500 text-sm mb-4">JP Nagar · 2 BHK Apartment</p>
              <div class="text-2xl font-black text-indigo-600">₹98,00,000</div>
              <p class="text-xs text-gray-400 mt-1">980 sq.ft Carpet Area · 4th Floor</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
              <span class="bg-red-100 text-red-800 text-xs font-bold px-2 py-1 rounded">CORRUPT DATA</span>
              <h3 class="text-xl font-bold mt-2">Sample Corrupt Entry</h3>
              <p class="text-gray-500 text-sm mb-4">Listed ID: 100-2000194</p>
              <div class="text-2xl font-black text-red-600">₹ -9,990,000</div>
              <p class="text-xs text-red-500 mt-1">Impossible Price & Carpet Area Mismatch</p>
            </div>
          </div>
        `;
      } else if (tab === 'rentals') {
        view.innerHTML = `
          <h2 class="text-3xl font-bold text-gray-900 mb-2">Rental Listings</h2>
          <p class="text-gray-500 mb-6">Assigned Locality: <span class="font-bold text-indigo-600">Kompally</span> (146 records, Total Rent: ₹50,63,800/mo)</p>
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h3 class="text-lg font-bold">Kompally Rental Overview</h3>
            <p class="text-gray-600 mt-1 text-sm">Average Rent: ₹34,683 / month across 146 retrievable properties.</p>
          </div>
        `;
      } else if (tab === 'projects') {
        view.innerHTML = `
          <h2 class="text-3xl font-bold text-gray-900 mb-2">Builder Projects</h2>
          <p class="text-gray-500 mb-6">Decoded Lakh/Crore Price Ranges & Mismatched Listing Counts</p>
          <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm mb-4">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="text-xl font-bold">Puravankara Vista (P20384)</h3>
                <p class="text-sm text-gray-500">Costliest Project in Dataset</p>
              </div>
              <div class="text-right">
                <span class="text-xs text-gray-400 uppercase font-semibold">Decoded Max Price</span>
                <div class="text-2xl font-extrabold text-emerald-600">₹4,15,00,000 (4.15 Cr)</div>
              </div>
            </div>
          </div>
        `;
      } else if (tab === 'saved') {
        view.innerHTML = `
          <h2 class="text-3xl font-bold text-gray-900 mb-2">Saved Properties</h2>
          <p class="text-gray-500 mb-6">Endpoint Discrepancy Resolved: Hits <code class="bg-gray-200 px-2 py-1 rounded text-sm text-indigo-700 font-bold">/v1/saved</code> instead of 404 <code class="bg-red-100 text-red-600 px-2 py-1 rounded text-sm">/v1/favourites</code></p>
          <div class="bg-white p-8 rounded-xl border border-gray-200 text-center py-12">
            <p class="text-gray-500">No saved properties in current user session.</p>
          </div>
        `;
      } else if (tab === 'insights') {
        view.innerHTML = `
          <h2 class="text-3xl font-bold text-gray-900 mb-2">Dataset Insights & Quality Audit</h2>
          <p class="text-gray-500 mb-6">Computed metrics directly from full offset-paged data extractions.</p>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
              <div class="text-xs font-bold text-gray-400 uppercase">Retrievable Listings</div>
              <div class="text-3xl font-black text-gray-900 mt-1">4,400</div>
              <div class="text-xs text-amber-600 mt-1">Undercounted as 4,157 in API total</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
              <div class="text-xs font-bold text-gray-400 uppercase">Unique Properties</div>
              <div class="text-3xl font-black text-indigo-600 mt-1">4,380</div>
              <div class="text-xs text-gray-500 mt-1">19 Duplicate Property Groups</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
              <div class="text-xs font-bold text-gray-400 uppercase">Corrupt Listings</div>
              <div class="text-3xl font-black text-red-600 mt-1">237</div>
              <div class="text-xs text-gray-500 mt-1">Invalid Prices/Areas/Floors</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
              <div class="text-xs font-bold text-gray-400 uppercase">2BHK Avg Rate</div>
              <div class="text-3xl font-black text-emerald-600 mt-1">₹17,914.95</div>
              <div class="text-xs text-gray-500 mt-1">Per sq.ft Carpet Area</div>
            </div>
          </div>
        `;
      }
    }
    showTab('listings');
  </script>
</body>
</html>
