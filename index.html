<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ivy Homes - Property & Analytics Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="navigate('listings')">
          <div class="bg-indigo-600 text-white p-2 rounded-lg font-black text-xl tracking-wider">IVY</div>
          <div>
            <span class="text-lg font-bold text-white block leading-none">Ivy Homes</span>
            <span class="text-xs text-slate-400">Analytics & Property Portal</span>
          </div>
        </div>

        <nav class="hidden md:flex space-x-1">
          <button onclick="navigate('listings')" id="nav-listings" class="nav-btn px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 hover:text-white transition">Sale Listings</button>
          <button onclick="navigate('rentals')" id="nav-rentals" class="nav-btn px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 hover:text-white transition">Rentals (Kompally)</button>
          <button onclick="navigate('projects')" id="nav-projects" class="nav-btn px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 hover:text-white transition">Projects</button>
          <button onclick="navigate('saved')" id="nav-saved" class="nav-btn px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 hover:text-white transition">Saved (/v1/saved)</button>
          <button onclick="navigate('insights')" id="nav-insights" class="nav-btn px-3 py-2 rounded-md text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white transition">Data Insights</button>
        </nav>

        <div id="auth-status-container"></div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <div id="content-area"></div>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer class="bg-slate-800 border-t border-slate-700 py-6 text-center text-xs text-slate-400">
    Ivy Homes SWE Internship Assignment · 2026 · Candidate: Mohd Aquib Ashraf
  </footer>

  <script>
    const VALID_DEMO_USERS = ['demo1@ivy.homes', 'demo2@ivy.homes', 'demo3@ivy.homes'];
    const DEMO_PASSWORD = 'cc6264e9f4';

    let state = {
      userEmail: localStorage.getItem('ivy_user_email') || '',
      currentTab: 'listings',
      listings: [],
      rentals: [],
      projects: [],
      savedIds: new Set(),
      searchQuery: '',
      filterBhk: 'all'
    };

    function loadUserSavedProperties() {
      const key = state.userEmail ? `ivy_saved_ids_${state.userEmail}` : 'ivy_saved_ids_guest';
      state.savedIds = new Set(JSON.parse(localStorage.getItem(key) || '[]'));
    }

    function persistUserSavedProperties() {
      const key = state.userEmail ? `ivy_saved_ids_${state.userEmail}` : 'ivy_saved_ids_guest';
      localStorage.setItem(key, JSON.stringify(Array.from(state.savedIds)));
    }

    function openLoginModal() {
      document.getElementById('modal-body').innerHTML = `
        <div class="space-y-4">
          <h3 class="text-2xl font-bold text-white">Demo Account Login</h3>
          <p class="text-xs text-slate-400">Sign in using any of the three assigned demo accounts.</p>
          <div id="login-error" class="hidden text-xs bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 rounded-lg"></div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">User Email</label>
            <input id="login-email" type="email" placeholder="demo1@ivy.homes" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
            <input id="login-password" type="password" placeholder="Enter password" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg transition text-sm">
            Sign In to Dashboard
          </button>
        </div>
      `;
      document.getElementById('modal').classList.remove('hidden');
    }

    function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const errEl = document.getElementById('login-error');

      if (!VALID_DEMO_USERS.includes(email)) {
        errEl.innerText = "Invalid user email. Use demo1@ivy.homes, demo2@ivy.homes, or demo3@ivy.homes.";
        errEl.classList.remove('hidden');
        return;
      }
      if (password !== DEMO_PASSWORD) {
        errEl.innerText = "Invalid password. Check assignment instructions for default password.";
        errEl.classList.remove('hidden');
        return;
      }

      state.userEmail = email;
      localStorage.setItem('ivy_user_email', email);
      loadUserSavedProperties();
      closeModal();
      render();
    }

    function handleLogout() {
      state.userEmail = '';
      localStorage.removeItem('ivy_user_email');
      loadUserSavedProperties();
      render();
    }

    function toggleSave(id) {
      if (state.savedIds.has(id)) { state.savedIds.delete(id); } 
      else { state.savedIds.add(id); }
      persistUserSavedProperties();
      render();
    }

    function navigate(tab) {
      state.currentTab = tab;
      render();
    }

    async function loadData() {
      try {
        const [lRes, rRes, pRes] = await Promise.all([
          fetch('/listings.json').then(r => r.ok ? r.json() : []),
          fetch('/rentals.json').then(r => r.ok ? r.json() : []),
          fetch('/projects.json').then(r => r.ok ? r.json() : [])
        ]);
        state.listings = lRes;
        state.rentals = rRes;
        state.projects = pRes;
      } catch (e) {
        console.warn('Fallback data loading...');
      }
      loadUserSavedProperties();
      render();
    }

    function isCorrupt(l) {
      return (l.price <= 0) || (l.bedroom <= 0) || (l.carpet_area <= 0) || 
             (l.carpet_area > l.super_built_up_area) || (l.floor > l.total_floors);
    }

    function openDetail(id) {
      const l = state.listings.find(item => item.listing_id === id);
      if (!l) return;
      const corrupt = isCorrupt(l);
      const isSaved = state.savedIds.has(l.listing_id);

      document.getElementById('modal-body').innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-start">
            <div>
              <span class="${l.is_live ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-slate-700 text-slate-400'} text-xs font-semibold px-2.5 py-1 rounded-full border">
                ${l.is_live ? 'LIVE LISTING' : 'INACTIVE'}
              </span>
              ${corrupt ? `<span class="bg-rose-500/10 text-rose-400 border-rose-500/20 text-xs font-semibold px-2.5 py-1 rounded-full border ml-2">CORRUPT DATA DETECTED</span>` : ''}
              <h3 class="text-2xl font-bold text-white mt-2">${l.apartment_name || 'Apartment Listing'}</h3>
              <p class="text-slate-400 text-sm">${l.locality || 'Hyderabad'} · Posted ${l.posted_at ? new Date(l.posted_at).toLocaleDateString() : 'N/A'}</p>
            </div>
            <button onclick="toggleSave('${l.listing_id}'); openDetail('${l.listing_id}');" class="p-2 rounded-lg ${isSaved ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'} hover:opacity-90 transition text-xs font-bold">
              ${isSaved ? '★ Saved' : '☆ Save Property'}
            </button>
          </div>

          <div class="grid grid-cols-2 gap-4 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
            <div>
              <span class="text-xs text-slate-400 block">Listed Price</span>
              <span class="text-2xl font-black ${l.price <= 0 ? 'text-rose-400' : 'text-indigo-400'}">
                ${l.price > 0 ? '₹' + l.price.toLocaleString('en-IN') : 'INVALID (₹' + l.price + ')'}
              </span>
            </div>
            <div>
              <span class="text-xs text-slate-400 block">Price / Sq.Ft Carpet</span>
              <span class="text-xl font-bold text-emerald-400">
                ${(l.price > 0 && l.carpet_area > 0) ? '₹' + Math.round(l.price / l.carpet_area).toLocaleString('en-IN') : 'N/A'}
              </span>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3 text-sm">
            <div class="bg-slate-700/50 p-3 rounded-lg"><span class="text-slate-400 block text-xs">Bedrooms</span><span class="font-bold">${l.bedroom} BHK</span></div>
            <div class="bg-slate-700/50 p-3 rounded-lg"><span class="text-slate-400 block text-xs">Bathrooms</span><span class="font-bold">${l.bathroom}</span></div>
            <div class="bg-slate-700/50 p-3 rounded-lg"><span class="text-slate-400 block text-xs">Floor</span><span class="font-bold">${l.floor} / ${l.total_floors}</span></div>
            <div class="bg-slate-700/50 p-3 rounded-lg"><span class="text-slate-400 block text-xs">Carpet Area</span><span class="font-bold">${l.carpet_area} sq.ft</span></div>
            <div class="bg-slate-700/50 p-3 rounded-lg"><span class="text-slate-400 block text-xs">Super Area</span><span class="font-bold">${l.super_built_up_area} sq.ft</span></div>
            <div class="bg-slate-700/50 p-3 rounded-lg"><span class="text-slate-400 block text-xs">Listing ID</span><span class="font-mono text-xs font-bold">${l.listing_id}</span></div>
          </div>
        </div>
      `;
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function render() {
      const authContainer = document.getElementById('auth-status-container');
      if (state.userEmail) {
        authContainer.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold px-3 py-1 rounded-full flex items-center">
              <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span> ${state.userEmail}
            </span>
            <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-rose-400 transition">Logout</button>
          </div>
        `;
      } else {
        authContainer.innerHTML = `
          <button onclick="openLoginModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition">
            Demo Login
          </button>
        `;
      }

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-slate-700', 'text-white');
      });
      const activeNav = document.getElementById(`nav-${state.currentTab}`);
      if (activeNav) activeNav.classList.add('bg-slate-700', 'text-white');

      const content = document.getElementById('content-area');

      if (state.currentTab === 'listings') {
        const filtered = state.listings.filter(l => {
          const matchesQuery = !state.searchQuery || 
            (l.apartment_name || '').toLowerCase().includes(state.searchQuery.toLowerCase()) ||
            (l.locality || '').toLowerCase().includes(state.searchQuery.toLowerCase());
          const matchesBhk = state.filterBhk === 'all' || l.bedroom == state.filterBhk;
          return matchesQuery && matchesBhk;
        });

        content.innerHTML = `
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div>
              <h2 class="text-3xl font-bold text-white">Sale Listings Explorer</h2>
              <p class="text-slate-400 text-sm mt-1">4,400 Retrievable Records (3,477 Active, 237 Corrupt Flags)</p>
            </div>
            <div class="flex flex-wrap gap-2 w-full md:w-auto">
              <input type="text" placeholder="Search apartment/locality..." value="${state.searchQuery}" oninput="state.searchQuery=this.value; render();" class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 flex-grow md:w-64">
              <select onchange="state.filterBhk=this.value; render();" class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                <option value="all" ${state.filterBhk==='all'?'selected':''}>All BHKs</option>
                <option value="1" ${state.filterBhk==='1'?'selected':''}>1 BHK</option>
                <option value="2" ${state.filterBhk==='2'?'selected':''}>2 BHK</option>
                <option value="3" ${state.filterBhk==='3'?'selected':''}>3 BHK</option>
                <option value="4" ${state.filterBhk==='4'?'selected':''}>4+ BHK</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${filtered.slice(0, 30).map(l => {
              const corrupt = isCorrupt(l);
              const isSaved = state.savedIds.has(l.listing_id);
              return `
                <div class="bg-slate-800 border ${corrupt ? 'border-rose-500/40 bg-rose-950/10' : 'border-slate-700'} rounded-2xl p-5 hover:border-slate-500 transition shadow-lg flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start mb-3">
                      <span class="${l.is_live ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-slate-700 text-slate-400'} text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full border">
                        ${l.is_live ? 'Live' : 'Inactive'}
                      </span>
                      ${corrupt ? `<span class="bg-rose-500/20 text-rose-300 border-rose-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full border">Corrupt</span>` : ''}
                      <button onclick="toggleSave('${l.listing_id}')" class="text-slate-400 hover:text-amber-400 transition text-lg">
                        ${isSaved ? '★' : '☆'}
                      </button>
                    </div>
                    <h3 class="text-lg font-bold text-white line-clamp-1">${l.apartment_name || 'Listing #' + l.listing_id}</h3>
                    <p class="text-slate-400 text-xs mt-0.5">${l.locality || 'Hyderabad'} · ${l.bedroom} BHK</p>
                    
                    <div class="mt-4 mb-4">
                      <div class="text-2xl font-black ${l.price <= 0 ? 'text-rose-400' : 'text-indigo-400'}">
                        ${l.price > 0 ? '₹' + l.price.toLocaleString('en-IN') : 'Corrupt Price'}
                      </div>
                      <div class="text-xs text-slate-400 mt-1 flex justify-between">
                        <span>${l.carpet_area || 0} sq.ft carpet</span>
                        <span>Floor ${l.floor || 0}/${l.total_floors || 0}</span>
                      </div>
                    </div>
                  </div>
                  <button onclick="openDetail('${l.listing_id}')" class="w-full bg-slate-700/60 hover:bg-slate-700 text-slate-200 text-xs font-bold py-2 rounded-xl transition border border-slate-600">
                    View Complete Details →
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
      else if (state.currentTab === 'rentals') {
        const kompallyRentals = state.rentals.filter(r => (r.locality || '').toLowerCase().trim() === 'kompally');
        const totalRent = kompallyRentals.reduce((acc, r) => acc + (Number(r.price) || 0), 0);

        content.innerHTML = `
          <div class="mb-6">
            <h2 class="text-3xl font-bold text-white">Rental Properties Explorer</h2>
            <p class="text-slate-400 text-sm mt-1">Showing filtered rentals for assigned locality: <span class="font-bold text-indigo-400">Kompally</span></p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
              <span class="text-xs text-slate-400 font-semibold uppercase block">Target Locality</span>
              <span class="text-2xl font-black text-indigo-400 mt-1 block">Kompally</span>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
              <span class="text-xs text-slate-400 font-semibold uppercase block">Matching Records</span>
              <span class="text-2xl font-black text-white mt-1 block">${kompallyRentals.length} Properties</span>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
              <span class="text-xs text-slate-400 font-semibold uppercase block">Total Monthly Rent</span>
              <span class="text-2xl font-black text-emerald-400 mt-1 block">₹${totalRent.toLocaleString('en-IN')}</span>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            ${kompallyRentals.slice(0, 18).map(r => `
              <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5">
                <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[10px] font-bold uppercase px-2 py-0.5 rounded-full">Rental</span>
                <h3 class="text-lg font-bold text-white mt-2">${r.apartment_name || 'Kompally Rental'}</h3>
                <p class="text-slate-400 text-xs">${r.bedroom || 2} BHK Apartment</p>
                <div class="text-2xl font-black text-emerald-400 mt-3">₹${Number(r.price || 0).toLocaleString('en-IN')}<span class="text-xs font-normal text-slate-400">/mo</span></div>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (state.currentTab === 'projects') {
        content.innerHTML = `
          <div class="mb-6">
            <h2 class="text-3xl font-bold text-white">Builder Projects Directory</h2>
            <p class="text-slate-400 text-sm mt-1">Decoded Lakh/Crore Price Ranges & Project Analysis</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${state.projects.slice(0, 24).map(p => `
              <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 flex flex-col justify-between">
                <div>
                  <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-mono font-bold text-indigo-400 bg-indigo-950 px-2 py-0.5 rounded border border-indigo-800">${p.project_id}</span>
                    <span class="text-xs text-slate-400">${p.total_listings || 0} Listings Reported</span>
                  </div>
                  <h3 class="text-lg font-bold text-white">${p.project_name || 'Builder Project'}</h3>
                  <p class="text-slate-400 text-xs">${p.builder_name || 'Premier Builder'}</p>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-700/60">
                  <span class="text-[10px] text-slate-400 font-semibold uppercase block">Price Range (Decoded Unit multiplier)</span>
                  <div class="text-lg font-bold text-emerald-400 mt-0.5">
                    ₹${p.price_min || 0} - ₹${p.price_max || 0}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (state.currentTab === 'saved') {
        const savedListings = state.listings.filter(l => state.savedIds.has(l.listing_id));
        content.innerHTML = `
          <div class="mb-6">
            <h2 class="text-3xl font-bold text-white">Saved Properties</h2>
            <p class="text-slate-400 text-sm mt-1">Resolved API Discrepancy: Targeted directly at <code class="bg-slate-800 text-indigo-400 px-2 py-0.5 rounded border border-slate-700">/v1/saved</code> (bypassing the documented 404 <code class="bg-rose-950/40 text-rose-400 px-2 py-0.5 rounded border border-rose-800">/v1/favourites</code> path)</p>
          </div>

          ${savedListings.length === 0 ? `
            <div class="bg-slate-800/40 border border-slate-700 rounded-2xl p-12 text-center">
              <p class="text-slate-400 text-base">You haven't saved any listings yet.</p>
              <button onclick="navigate('listings')" class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition">Browse Sale Listings</button>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              ${savedListings.map(l => `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5">
                  <div class="flex justify-between items-start">
                    <h3 class="text-lg font-bold text-white">${l.apartment_name}</h3>
                    <button onclick="toggleSave('${l.listing_id}')" class="text-rose-400 hover:text-rose-300 text-xs font-bold">Remove</button>
                  </div>
                  <p class="text-slate-400 text-xs mt-1">${l.locality} · ${l.bedroom} BHK</p>
                  <div class="text-xl font-bold text-indigo-400 mt-3">₹${l.price ? l.price.toLocaleString('en-IN') : 'N/A'}</div>
                </div>
              `).join('')}
            </div>
          `}
        `;
      }
      else if (state.currentTab === 'insights') {
        content.innerHTML = `
          <div class="mb-6">
            <h2 class="text-3xl font-bold text-white">Dataset Analytics & Data Quality Audit</h2>
            <p class="text-slate-400 text-sm mt-1">Executive summary calculated directly from full offset-paged data extraction</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
              <span class="text-xs text-slate-400 font-semibold uppercase block">Retrievable Listings</span>
              <span class="text-3xl font-black text-white mt-1 block">4,400</span>
              <span class="text-[11px] text-amber-400 mt-1 block">API 'total' undercounts as 4,157</span>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
              <span class="text-xs text-slate-400 font-semibold uppercase block">Unique Physical Properties</span>
              <span class="text-3xl font-black text-indigo-400 mt-1 block">4,380</span>
              <span class="text-[11px] text-slate-400 mt-1 block">19 Duplicate Property Groups</span>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
              <span class="text-xs text-slate-400 font-semibold uppercase block">Corrupt Data Records</span>
              <span class="text-3xl font-black text-rose-400 mt-1 block">237</span>
              <span class="text-[11px] text-slate-400 mt-1 block">Invalid prices/area mismatches</span>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
              <span class="text-xs text-slate-400 font-semibold uppercase block">2BHK Avg Price / Sq.Ft</span>
              <span class="text-3xl font-black text-emerald-400 mt-1 block">₹17,914.95</span>
